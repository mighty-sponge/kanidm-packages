name: build

on:
  push:
    tags:
      - "v*-*"
  workflow_dispatch:
    inputs:
      version:
        description: "upstream kanidm version (tag without v)"
        required: true
        default: "1.12.1"
      release:
        description: "package release"
        required: true
        default: "1"

permissions:
  contents: write

env:
  # kanidm/kanidm_ppa_automation: upstream deb packaging scripts, pinned
  PPA_AUTOMATION_REF: 0d99aac13cb1cabb37e7ab847e9e1358aaadcfd6
  DEB_TARGET: x86_64-unknown-linux-gnu

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - name: Version
        id: v
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_RELEASE: ${{ inputs.release }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            tag="${REF_NAME#v}"
            ver="${tag%-*}"
            rel="${tag##*-}"
          else
            ver="$IN_VERSION"
            rel="$IN_RELEASE"
          fi
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "release=$rel" >> "$GITHUB_OUTPUT"
          echo "building kanidm $ver-$rel"

  rpm:
    needs: version
    runs-on: ubuntu-latest
    container: almalinux:9
    timeout-minutes: 120
    env:
      VER: ${{ needs.version.outputs.version }}
      REL: ${{ needs.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - name: Build dependencies
        run: |
          dnf -y install dnf-plugins-core rpm-build git
          dnf config-manager --set-enabled crb
          dnf -y builddep kanidm.spec --define "pkgver $VER" --define "pkgrel $REL"
          rustc --version

      - name: Source
        run: |
          mkdir -p ~/rpmbuild/SOURCES
          curl -fsSL -o ~/rpmbuild/SOURCES/kanidm-$VER.tar.gz \
            https://github.com/kanidm/kanidm/archive/refs/tags/v$VER.tar.gz

      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-el9-${{ env.VER }}

      - name: Build RPMs
        run: rpmbuild -bb kanidm.spec --define "pkgver $VER" --define "pkgrel $REL"

      - name: Show packages
        run: |
          for f in ~/rpmbuild/RPMS/x86_64/*.rpm; do
            echo "=== $(basename $f)"
            rpm -qp --requires "$f" | grep -v '^rpmlib' | sed 's/^/requires: /'
            rpm -qlp "$f" | grep -v '^/usr/share/kanidm/ui/hpkg/'
          done
          mkdir -p dist && cp ~/rpmbuild/RPMS/x86_64/*.rpm dist/

      - uses: actions/upload-artifact@v7
        with:
          name: kanidm-${{ env.VER }}-${{ env.REL }}-el9
          path: dist/*.rpm

  deb:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os:
          - codename: noble
            image: ubuntu:24.04
          - codename: trixie
            image: debian:13
    runs-on: ubuntu-latest
    container: ${{ matrix.os.image }}
    timeout-minutes: 120
    env:
      VER: ${{ needs.version.outputs.version }}
      REL: ${{ needs.version.outputs.release }}
      CODENAME: ${{ matrix.os.codename }}
    steps:
      # git must exist before checkout, otherwise checkout falls back to the REST API without .git
      - name: Get git
        run: apt-get update && apt-get install -y git ca-certificates curl

      - name: Checkout Kanidm
        uses: actions/checkout@v7
        with:
          repository: kanidm/kanidm
          ref: v${{ env.VER }}
          submodules: false

      - name: Checkout packaging scripts
        uses: actions/checkout@v7
        with:
          repository: kanidm/kanidm_ppa_automation
          ref: ${{ env.PPA_AUTOMATION_REF }}
          path: platform/debian/kanidm_ppa_automation

      - name: Build dependencies
        run: platform/debian/kanidm_ppa_automation/scripts/install_ci_build_dependencies.sh

      # distro rust is too old: install the version from Cargo.toml (build_native.sh pins it too)
      - name: Rust
        run: |
          rust_version="$(awk -F '"' '/^rust-version/ {print $2}' Cargo.toml)"
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-all-errors -fsSL https://sh.rustup.rs \
            | sh -s -- --default-toolchain "$rust_version" --profile minimal -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.os.codename }}-${{ env.VER }}

      - name: Build binaries
        run: platform/debian/kanidm_ppa_automation/scripts/build_native.sh "$DEB_TARGET"

      - name: Strip binaries
        run: |
          find "target/$DEB_TARGET/release" -maxdepth 1 -not -name "*.d" -name "kanidm*" \
            | xargs llvm-strip --strip-all

      # upstream derives the deb version from the commit date; use <version>-<release>~<codename> instead
      - name: Build debs
        run: |
          script=platform/debian/kanidm_ppa_automation/scripts/build_debs.sh
          sed -i -E 's|^PACKAGE_VERSION=.*|PACKAGE_VERSION="${VER}-${REL}~${CODENAME}"|' "$script"
          grep -q '^PACKAGE_VERSION="${VER}-${REL}~${CODENAME}"$' "$script"
          "$script" "$DEB_TARGET"

      # GitHub mangles "~" in asset names: rename files, the version inside stays <ver>-<rel>~<codename>
      - name: Show packages
        run: |
          mkdir -p dist
          for f in target/"$DEB_TARGET"/debian/*.deb; do
            pkg="$(dpkg-deb -f "$f" Package)"
            arch="$(dpkg-deb -f "$f" Architecture)"
            echo "=== $pkg $(dpkg-deb -f "$f" Version) $arch"
            dpkg-deb -f "$f" Depends | sed 's/^/depends: /'
            dpkg-deb -c "$f" | awk '{print $6}' | grep -v '^./usr/share/kanidmd/static/.' || true
            cp "$f" "dist/${pkg}_${VER}-${REL}.${CODENAME}_${arch}.deb"
          done
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: kanidm-${{ env.VER }}-${{ env.REL }}-${{ matrix.os.codename }}
          path: dist/*.deb

  release:
    if: github.ref_type == 'tag'
    needs: [rpm, deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
